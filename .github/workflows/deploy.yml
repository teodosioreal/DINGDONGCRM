# Deploy automático: todo push na main atualiza o CRM na VPS.
# Mexe só em /opt/dingdong-crm e no processo "dingdong-crm" do pm2
# (veja deploy/atualizar.sh). Se a versão nova não subir, volta sozinho.
#
# Segredos necessários em Settings → Secrets and variables → Actions deste
# repositório (DINGDONGCRM) — podem ser os mesmos valores do rastreador:
#   VPS_HOST     IP ou domínio da VPS
#   VPS_USER     usuário do SSH (ex.: root)
#   VPS_SSH_KEY  chave privada autorizada no ~/.ssh/authorized_keys da VPS
#   VPS_PORT     (opcional) porta do SSH, padrão 22
name: Deploy na VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# um deploy por vez; se chegar um push novo no meio, espera o anterior terminar
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Conferir sintaxe antes de enviar
        run: |
          for f in server.js src/*.js public/*.js; do node --check "$f"; done
          bash -n deploy/atualizar.sh deploy/instalar.sh

      - name: Conferir os segredos da VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          faltando=""
          [ -n "$VPS_HOST" ] || faltando="$faltando VPS_HOST"
          [ -n "$VPS_USER" ] || faltando="$faltando VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || faltando="$faltando VPS_SSH_KEY"
          if [ -n "$faltando" ]; then
            echo "::error::Cadastre em Settings → Secrets and variables → Actions:$faltando"
            exit 1
          fi

      - name: Atualizar na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          # token temporário deste job, só com leitura do repositório (ele é privado)
          TOKEN_LEITURA: ${{ github.token }}
        run: |
          PORTA="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          # Arruma a chave como ela costuma chegar quando é copiada e colada:
          # espaços no começo das linhas, quebras de linha do Windows, "\n"
          # literais ou tudo numa linha só.
          python3 - <<'PY'
          import os, re
          k = os.environ["VPS_SSH_KEY"].replace("\r", "").replace("\\n", "\n").strip()
          m = re.search(r"(-----BEGIN [A-Z ]+-----)(.*?)(-----END [A-Z ]+-----)", k, re.S)
          # Diagnóstico SEM mostrar a chave: só tamanhos e se o formato confere
          print(f"Diagnóstico da VPS_SSH_KEY: {len(k)} caracteres; BEGIN encontrado: {'-----BEGIN' in k}; END encontrado: {'-----END' in k}")
          if not m:
              raise SystemExit("::error::VPS_SSH_KEY não parece uma chave privada: precisa ir da linha -----BEGIN ... até a -----END ... (inclusive).")
          corpo = "".join(m.group(2).split())
          import base64, binascii
          try:
              bruto = base64.b64decode(corpo, validate=True)
              print(f"Conteúdo: {len(corpo)} caracteres base64 (uma chave ed25519 tem 336); formato OpenSSH: {bruto.startswith(b'openssh-key-v1')}")
          except binascii.Error:
              print(f"Conteúdo: {len(corpo)} caracteres, mas com caracteres inválidos (não é base64) — algo diferente foi colado junto.")
          linhas = [corpo[i:i + 70] for i in range(0, len(corpo), 70)]
          path = os.path.expanduser("~/.ssh/id_deploy")
          with open(path, "w") as f:
              f.write("\n".join([m.group(1)] + linhas + [m.group(3)]) + "\n")
          os.chmod(path, 0o600)
          PY
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub \
            || { echo "::error::A VPS_SSH_KEY cadastrada está incompleta ou corrompida. Cole de novo, da linha BEGIN até a END."; exit 1; }
          # impressão digital pública (não é segredo): tem que ser igual à mostrada na VPS pelo ssh-keygen
          echo "Chave carregada. Impressão digital: $(ssh-keygen -lf ~/.ssh/id_deploy.pub)"
          ssh-keyscan -p "$PORTA" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # O script vai por um arquivo temporário privado (chmod 600) que é apagado
          # no fim — assim o token não aparece na linha de comando da VPS.
          { printf 'GITHUB_TOKEN=%q\n' "$TOKEN_LEITURA"; cat deploy/atualizar.sh; } \
            | ssh -i ~/.ssh/id_deploy -p "$PORTA" -o BatchMode=yes -o ConnectTimeout=20 \
                "$VPS_USER@$VPS_HOST" \
                'f=$(mktemp); trap "rm -f $f" EXIT; cat > "$f"; bash "$f" </dev/null'
