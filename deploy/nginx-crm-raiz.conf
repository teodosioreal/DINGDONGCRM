# CRM na RAIZ do domínio (https://odingdong.tech), mantendo os endereços
# antigos com /crm funcionando (códigos do chat colados nos sites e webhooks
# do WhatsApp que já apontam para /crm/...).
#
# Fica DENTRO do "server { ... }" do odingdong.tech que escuta a porta 443,
# NO LUGAR dos blocos "location" que existem hoje (inclusive o antigo /crm).
# O passo a passo está em deploy/MUDAR-PARA-RAIZ.md.

# o painel na raiz
location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 20m;   # igual ao de hoje (o painel manda arquivos grandes em partes de 1 MB)
}

# endereços antigos: as telas vão para a raiz...
location = /crm  { return 301 /; }
location = /crm/ { return 301 /; }
location = /crm/login { return 301 /login; }

# ...e o resto (chat.js, api/, midia/, capa/, anexo/, logo/) continua
# respondendo em /crm/, sem o /crm no caminho que chega ao app
location /crm/ {
    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 20m;
}
